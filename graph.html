<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCV – Analyse & Prédictions</title>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getDatabase } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBgMe1IeUXUH6t8fZdy2v_-DgC_NebzZsI",
      authDomain: "smartcv-gildas.firebaseapp.com",
      databaseURL: "https://smartcv-gildas-default-rtdb.firebaseio.com/",
      projectId: "smartcv-gildas",
      storageBucket: "smartcv-gildas.firebasestorage.app",
      messagingSenderId: "292069513256",
      appId: "1:292069513256:web:af2bab1d97169ac228fd1d",
      measurementId: "G-G0MMKDVDJ2"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getDatabase(app);
  </script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg-color: #0A192F;
      --container-bg: #112240;
      --primary-color: #65C2CC;
      --accent-color: #FF9F1C;
      --text-color: #E6F1FF;
      --card-bg: #172A45;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      background: var(--container-bg);
      border-radius: 20px;
      padding: 40px;
      border: 1px solid var(--primary-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 30px;
      font-size: 2.5em;
    }

    .nav {
      text-align: center;
      margin-bottom: 30px;
    }

    .nav a {
      color: var(--primary-color);
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
      border: 1px solid var(--primary-color);
      padding: 8px 12px;
      border-radius: 5px;
      display: inline-block;
    }

    /* KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .kpi-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid var(--primary-color);
    }

    .kpi-value {
      font-size: 2.5em;
      color: var(--accent-color);
      font-weight: bold;
      display: block;
    }

    /* Charts */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .chart-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 15px;
      height: 350px;
      border: 1px solid var(--primary-color);
    }

    canvas {
      max-width: 100%;
    }

    select {
      padding: 10px;
      border-radius: 5px;
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--primary-color);
      width: 100%;
      max-width: 300px;
    }

    #resultatPred {
      color: var(--accent-color);
      font-size: 1.5em;
      margin-top: 15px;
      font-weight: bold;
    }

    /* =========================
       📱 TABLETTE
    ========================= */
    @media (max-width: 992px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 2em;
      }

      .charts-grid {
        grid-template-columns: 1fr;
      }

      .chart-card {
        height: 300px;
      }

      .kpi-value {
        font-size: 2em;
      }
    }

    /* =========================
       📱 MOBILE
    ========================= */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
        border-radius: 12px;
      }

      h1 {
        font-size: 1.6em;
      }

      .nav a {
        display: inline-block;
        margin: 5px 5px;
        font-size: 0.85em;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .kpi-card {
        padding: 15px;
      }

      .kpi-value {
        font-size: 1.8em;
      }

      .charts-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .chart-card {
        height: 250px;
      }

      select {
        max-width: 100%;
      }

      #resultatPred {
        font-size: 1.2em;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📊 Analyse & Prédictions</h1>

    <div class="nav">
      <a href="index.html">🏠 Accueil</a>
      <a href="form.html">📝 Formulaire</a>
      <a href="data.html">📋 Données</a>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <h3>Âge Moyen</h3>
        <span id="kpi-age" class="kpi-value">--</span>
      </div>

      <div class="kpi-card">
        <h3>Salaire Moyen</h3>
        <span id="kpi-salaire" class="kpi-value">--</span>
      </div>

      <div class="kpi-card">
        <h3>Satisfaction</h3>
        <span id="kpi-satisfaction" class="kpi-value">--</span>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <canvas id="sexPieChart"></canvas>
      </div>

      <div class="chart-card">
        <canvas id="jobPieChart"></canvas>
      </div>
    </div>

    <div class="kpi-card">
      <h2>🚀 Simulateur de prédiction</h2>
      <p style="margin:10px 0;">Choisir une profession :</p>

      <select id="predSelect" onchange="predictSalary()">
        <option value="">-- Choisir --</option>
      </select>

      <p id="resultatPred">--</p>
    </div>
  </div>

<script type="module">
import { ref, onValue } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

const dbRef = ref(window.db, 'profil_carriere');

let sexChart, jobChart;

onValue(dbRef, (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  const participants = Object.values(data);

  const ageSum = participants.reduce((s, p) => s + parseInt(p.age), 0);
  document.getElementById('kpi-age').textContent =
    Math.round(ageSum / participants.length) + " ans";

  const satSum = participants.reduce((s, p) => s + parseInt(p.satisfaction), 0);
  document.getElementById('kpi-satisfaction').textContent =
    (satSum / participants.length).toFixed(1) + " /10";

  function salaireToNumber(s) {
    if (s === "0-50000") return 25000;
    if (s === "50000-150000") return 100000;
    if (s === "150000-300000") return 225000;
    if (s === "300000+") return 350000;
    return 0;
  }

  const salSum = participants.reduce((s, p) => s + salaireToNumber(p.salaire), 0);
  document.getElementById('kpi-salaire').textContent =
    Math.round(salSum / participants.length).toLocaleString() + " XAF";

  const sexCount = { H: 0, F: 0 };
  participants.forEach(p => sexCount[p.sexe]++);

  if (sexChart) sexChart.destroy();

  sexChart = new Chart(document.getElementById('sexPieChart'), {
    type: 'pie',
    data: {
      labels: ['Hommes', 'Femmes'],
      datasets: [{ data: [sexCount.H, sexCount.F] }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  const jobCount = {};
  participants.forEach(p => {
    jobCount[p.profession] = (jobCount[p.profession] || 0) + 1;
  });

  if (jobChart) jobChart.destroy();

  jobChart = new Chart(document.getElementById('jobPieChart'), {
    type: 'pie',
    data: {
      labels: Object.keys(jobCount),
      datasets: [{ data: Object.values(jobCount) }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  const salaryMap = {};
  const countMap = {};

  participants.forEach(p => {
    const sal = salaireToNumber(p.salaire);

    salaryMap[p.profession] = (salaryMap[p.profession] || 0) + sal;
    countMap[p.profession] = (countMap[p.profession] || 0) + 1;
  });

  const select = document.getElementById('predSelect');
  select.innerHTML = '<option value="">-- Choisir --</option>';

  Object.keys(salaryMap).forEach(job => {
    const opt = document.createElement('option');
    opt.value = job;
    opt.textContent = job;
    select.appendChild(opt);
  });

  window.predictSalary = function() {
    const job = select.value;
    if (!job) return;

    const avg = salaryMap[job] / countMap[job];
    document.getElementById('resultatPred').textContent =
      "Estimation : " + Math.round(avg).toLocaleString() + " XAF";
  };
});
</script>

</body>
</html>
